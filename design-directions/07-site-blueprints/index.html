<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(x,y,s,size=16,cls='',weight=400)=>`<text x="${x}" y="${y}" font-size="${size}" class="${cls}" font-weight="${weight}">${esc(s)}</text>`;
const mt=(x,y,lines,size=15,cls='dim',gap=26)=>lines.map((s,i)=>t(x,y+i*gap,s,size,cls)).join('');
const r=(x,y,w,h,cls='surface',rx=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${cls}"/>`;
const l=(x,y,xx,yy,cls='stroke')=>`<path d="M${x} ${y} L${xx} ${yy}" class="${cls}"/>`;
const path=(d,cls='accent-line')=>`<path d="${d}" class="${cls}"/>`;
const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.5" class="number"/>`;
const num=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="12" class="number"/>${t(x-4,y+4,n,11,'number-text',600)}`;
const arr=(x,y,xx,yy)=>{const a=Math.atan2(yy-y,xx-x),u=a-.55,v=a+.55;return l(x,y,xx,yy,'accent-line')+path(`M${xx-9*Math.cos(u)} ${yy-9*Math.sin(u)} L${xx} ${yy} L${xx-9*Math.cos(v)} ${yy-9*Math.sin(v)}`)};
const card=(x,y,w,h,title,lines=[],cls='surface')=>r(x,y,w,h,cls)+t(x+20,y+32,title,18,'',550)+mt(x+20,y+62,lines,14);
const link=(sheet,x,y,label,size=15)=>`<a href="#sheet-${sheet}">${t(x,y,label,size,'accent-text',500)}</a>`;
const media=(x,y,w,h,label='代表媒体',paper=false)=>r(x,y,w,h,paper?'paper':'media')+path(`M${x+16} ${y+h-18} L${x+w*.4} ${y+h*.48} L${x+w*.64} ${y+h*.7} L${x+w-18} ${y+h*.28}`,'stroke')+t(x+18,y+30,label,14,'dim');
const lines=(x,y,w,count=4,step=19)=>Array.from({length:count},(_,i)=>l(x,y+i*step,x+w*(i===count-1?.7:1),y+i*step)).join('');
const smallFrame=(x,y,w,h,title)=>r(x,y,w,h)+l(x,y+42,x+w,y+42)+t(x+15,y+27,title,13,'dim');
const shell=(x=40,y=68,w=1200,h=624,label='/')=>smallFrame(x,y,w,h,`浏览器视口 / ${label}`);
const footer=(x,y,w=1100)=>l(x,y,x+w,y)+t(x,y+26,'全部内容',14,'accent-text')+t(x+w-338,y+26,'关于与联系     明 / 暗     中 / EN     字号',14,'dim');
const drawing=(id,body)=>`<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title-${id}"><title id="svg-title-${id}">${esc(id)} 设计线框</title>${t(40,33,'PERSONAL WEBSITE / STRUCTURAL DRAWING',11,'dim')}${t(1120,33,'V1 · 2026.09',11,'dim')}${body}${l(40,754,1240,754)}${t(40,778,'图形为内容角色占位 · 非真实项目 / 非最终材质 / 非已实现页面',12,'dim')}${t(1110,778,id,12,'accent-text')}</svg>`;
const homeBase=()=>shell()+t(90,151,'姓名 / Name',25,'',550)+mt(90,181,['一句真实的自我介绍；必要的当下关联。','直接可见的联系入口 ↗'],14)+link('07',1010,154,'关于与联系 ↗',14)+media(90,260,365,240,'A · 代表项目 / 图片原比例')+t(90,527,'[项目的真实标题] ↗',20)+t(90,551,'一句语境 · 时间 / 地点按需显示',13,'dim')+r(560,220,235,145,'paper')+t(580,252,'B · [短记录的标题]',17)+lines(580,280,182,3)+t(560,390,'独立内容；可与 A 有实际关联',13,'dim')+r(952,300,190,228,'paper')+media(965,313,164,159,'C · 照片')+t(965,508,'[照片或图集标题]',13)+t(952,554,'地点 / 简短图注',13,'dim')+t(575,485,'D · [另一篇文章的标题] ↗',20)+mt(575,514,['无封面时，文字本身成为入口。','它不必与 A、B、C 发生关系。'],14)+footer(90,610,1100);

{id:'01',name:'首页 · 桌面',title:'个人信息与自由对象共享同一表面',lead:'原图的留白、尺度差和分布感保留。每个可点击物件有真实标题；纯文字也能成为一个完整入口。',notes:[['A / 视觉锚点','一条精选内容提供主视觉，不等于整站只能讲这件事。大小由媒体比例与编辑意图决定。'],['B / C / D 各有身份','B 是短记录，C 是图集，D 是无封面的文字。是否相关由内容决定，不由材质决定。'],['页面可以向下延续','首屏不压进所有内容。下一组精选自然滚动出现；全量内容永远可以从索引找到。']],svg:()=>drawing('01',homeBase()+num(62,150,'1')+num(62,274,'2')+num(835,239,'3')+path('M455 286 L525 286 L525 248 L552 248','ghost')+t(435,583,'仅在实际有关联时，A ↔ B 才有注释；本线为设计示意。',13,'dim'))},
{id:'02',name:'构图与增长规则',title:'“自由”由关系、比例与留白共同约束',lead:'先设计少量构图，再让内容适配。首页不使用随机散落，也不依赖固定像素坐标承受所有语言与字号。',notes:[['新增内容的路径','发布先进入索引；设置精选后进入适合的构图单元。无媒体则使用文字入口。'],['布局优先级','可读性 > 内容顺序 > 语义关系 > 构图细节 > 材质装饰。空间不够时增高或重排。'],['稳定的空间记忆','悬停不换位、不放大布局；明暗色切换保持相同顺序。字号和窄屏可以触发真实重排。']],svg:()=>drawing('02',
smallFrame(60,85,745,485,'1440px 参考视口 / 12 列隐性基准')+Array.from({length:13},(_,i)=>l(91+i*53,153,91+i*53,530,'ghost')).join('')+r(90,142,680,56,'wash')+t(108,178,'身份与导航安全区',16)+media(100,258,242,165,'主媒体')+r(435,229,140,98,'paper')+t(450,265,'中等入口',14)+r(648,338,110,142,'paper')+t(658,380,'照片入口',14)+t(440,433,'文字入口',17)+t(440,462,'标题按自然行高排布',13,'dim')+path('M80 248 L70 248 L70 485 L80 485')+t(92,510,'间距包含标题；媒体重叠不遮文字或点击区域。',14,'dim')+card(855,85,360,130,'01 · 选内容',['精选集合独立于数据；4–6 条为起点','少内容更疏朗，不造物件填空。'])+card(855,235,360,135,'02 · 选构图',['按数量、宽高比、文字长度适配','不是按项目 / 教育永久分区。'])+card(855,390,360,155,'03 · 测量后绘线',['先排内容和标题，再算关系端点','最多少量连接；正文遮挡零容忍','增加字号时重新排，不缩字。'])+r(60,610,1155,90,'wash')+t(85,644,'未来多了一篇文章',18,'',550)+t(85,674,'Entry → 索引自动出现 → 可选精选 → 适配新构图单元 → 原有链接与阅读顺序稳定',16,'accent-text'))},
{id:'03',name:'交互与返回',title:'从看见内容到进入阅读，行为始终一致',lead:'悬停只提供轻微反馈与额外关系信息。移动端直接点击进入；必要信息不依赖 hover。',notes:[['不让目标移动','上一版悬停后重新布局会破坏点击和空间记忆。本版只改下划线、焦点及少量关系线。'],['进入是普通链接','可复制地址、开新标签、键盘进入。动画是增强，失败时正常导航。'],['浮层与页面分开','详情是独立页面；大图和关于才是可关闭的局部状态。后退先关闭浮层再离开页面。']],svg:()=>drawing('03',

const nav=document.getElementById('nav'),holder=document.getElementById('sheets');
nav.innerHTML=sheets.map(s=>`<a href="#sheet-${s.id}"><span>${s.id}</span>${esc(s.name)}</a>`).join('');
holder.innerHTML=sheets.map(s=>`<section class="sheet" id="sheet-${s.id}" hidden aria-labelledby="title-${s.id}"><div class="heading"><div><div class="eyebrow">DRAWING ${s.id} / ${esc(s.name)}</div><h1 id="title-${s.id}" tabindex="-1">${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p></div><span class="sheet-status">结构设计 · 待评审</span></div><div class="drawing">${s.svg()}</div><div class="footnotes">${s.notes.map(([h,p])=>`<div><h2>${esc(h)}</h2><p>${esc(p)}</p></div>`).join('')}</div><p class="legal">本图纸使用内容角色占位。网站真实内容、字体资源和材质资产需后续确认；工程指标不作为用户事实。</p></section>`).join('');
let current=0;
function show(){const id=location.hash.replace('#sheet-','');const index=sheets.findIndex(s=>s.id===id);current=index<0?0:index;document.querySelectorAll('.sheet').forEach((s,i)=>s.hidden=i!==current);nav.querySelectorAll('a').forEach((a,i)=>{if(i===current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('position').textContent=`${current+1} / ${sheets.length} · ${sheets[current].name}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===sheets.length-1;document.title=`${sheets[current].name} · 个人网站设计图纸`;}
window.addEventListener('hashchange',()=>{show();window.scrollTo({top:0,behavior:'instant'});document.getElementById(`title-${sheets[current].id}`).focus({preventScroll:true})});
document.getElementById('prev').addEventListener('click',()=>{if(current>0)location.hash=`sheet-${sheets[current-1].id}`});document.getElementById('next').addEventListener('click',()=>{if(current<sheets.length-1)location.hash=`sheet-${sheets[current+1].id}`});
document.getElementById('theme').addEventListener('click',e=>{const dark=document.body.classList.toggle('view-dark');e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'图纸明色':'图纸暗色'});
document.getElementById('print').addEventListener('click',()=>window.print());show();
window.addEventListener('load',()=>requestAnimationFrame(()=>window.scrollTo({top:0,behavior:'instant'})));
</script>
